[package]
name = "otsniff-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
otsniff = { path = ".." }

# TODO(S-3.04 step 4): pin exact versions of libfuzzer-sys and transitive deps
# to ensure deterministic corpus reproduction across runs and environments.

[workspace]
# This empty workspace table isolates the fuzz package from the main crate's
# workspace, preventing `cargo` from treating fuzz/ as a member of the parent
# workspace. The fuzz harnesses are built on demand; they are NOT compiled
# during `cargo check` or `cargo test` in the main crate.

[[bin]]
name = "parse_modbus"
path = "fuzz_targets/parse_modbus.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_enip"
path = "fuzz_targets/parse_enip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_s7comm"
path = "fuzz_targets/parse_s7comm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_dhcp"
path = "fuzz_targets/parse_dhcp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_dnp3"
path = "fuzz_targets/parse_dnp3.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scrub_text"
path = "fuzz_targets/scrub_text.rs"
test = false
doc = false
bench = false
