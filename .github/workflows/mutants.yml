name: Mutants (weekly)

# Runs mutation tests on the develop tip once per week.
# Does NOT trigger on pull_request — mutation testing is slow (~30 min) and
# must not block PR merges per AC-002.  Results are surfaced as a GitHub
# Actions step summary and as a downloadable artifact.

on:
  schedule:
    # Monday 06:00 UTC — runs on develop tip once per week.
    # Weekly cadence is appropriate: mutation suites are slow and the codebase
    # does not change faster than once a week for the security-critical modules.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allow manual trigger for ad-hoc baseline runs or after a large refactor.

jobs:
  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants (pinned to ^27)
        # Pin the major version to keep CI reproducible.  Bump manually when
        # a new major release is validated against this config.
        run: cargo install --locked cargo-mutants --version "^27"

      - name: Run mutation testing
        run: |
          cargo mutants \
            --no-shuffle \
            --timeout-multiplier 5 \
            --output mutants-out \
            --config .cargo-mutants.toml
        env:
          RUST_BACKTRACE: 1

      - name: Upload mutation results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-results
          path: mutants-out/**
          retention-days: 30

      - name: Post kill-rate summary to Actions step summary
        if: always()
        run: |
          # Parse the outcomes.json produced by cargo-mutants and compute kill rate.
          OUTCOMES="mutants-out/outcomes.json"
          if [ -f "$OUTCOMES" ]; then
            KILLED=$(python3 -c "
          import json, sys
          data = json.load(open('$OUTCOMES'))
          outcomes = data.get('outcomes', [])
          killed  = sum(1 for o in outcomes if o.get('summary') in ('MissedMutations', 'killed', 'caught'))
          total   = len(outcomes)
          survived = sum(1 for o in outcomes if o.get('summary') == 'missed')
          timeout  = sum(1 for o in outcomes if o.get('summary') == 'timeout')
          print(f'{killed} {total} {survived} {timeout}')
          " 2>/dev/null || echo "0 0 0 0")
            read -r KILLED TOTAL SURVIVED TIMEOUT <<< "$KILLED"
            if [ "$TOTAL" -gt 0 ]; then
              KILL_PCT=$(python3 -c "print(f'{$KILLED/$TOTAL*100:.1f}')")
            else
              KILL_PCT="n/a"
            fi
          else
            KILLED=0; TOTAL=0; SURVIVED=0; TIMEOUT=0; KILL_PCT="n/a"
          fi

          {
            echo "## Mutation testing results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Kill rate | ${KILL_PCT}% |"
            echo "| Killed / Total | ${KILLED} / ${TOTAL} |"
            echo "| Survived | ${SURVIVED} |"
            echo "| Timeout | ${TIMEOUT} |"
            echo ""
            echo "See the \`mutants-results\` artifact for the full report."
            echo ""
            echo "> Baseline: 84.1% (wave-1, effective kill rate after disposition)."
            echo "> Threshold: 79.1% (5pp below baseline). Below threshold fails CI."
          } >> "$GITHUB_STEP_SUMMARY"

          # F-ADV-P3-007: POL-11 — fail CI on kill-rate regression instead of
          # writing a "soft signal" to the step summary that nobody reads.
          # Threshold is 5pp below the 84.1% baseline = 79.1%.
          if [ "$KILL_PCT" = "n/a" ]; then
            echo "::warning::mutation testing produced no outcomes.json (cargo-mutants may have failed early); not gating"
            exit 0
          fi
          THRESHOLD_OK=$(python3 -c "print(1 if $KILL_PCT >= 79.1 else 0)")
          if [ "$THRESHOLD_OK" = "1" ]; then
            echo "Check passed: kill rate ${KILL_PCT}% (>= 79.1% threshold), ${KILLED}/${TOTAL} mutants killed"
          else
            echo "::error::F-ADV-P3-007: kill rate ${KILL_PCT}% is below threshold 79.1% (5pp below 84.1% baseline). See mutants-results artifact for surviving mutants."
            exit 1
          fi
