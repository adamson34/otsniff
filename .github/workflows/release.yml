name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; only the `release` job gets write (ADV-P1
# F-P1-023). The build job compiles build.rs from the whole dependency
# tree — now two crates' worth — and has no business holding a token that
# can push to the repo or mutate releases.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # aarch64-unknown-linux-gnu via cross-rs hits glibc-version
          # mismatches on recent build scripts (e.g. serde_core 1.0.228).
          # Re-add in v0.2 when we sort out the right cross-compile path.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # ADV-P2 F-P2-044: the cross-rs branch that used to live here keyed off
      # `matrix.use_cross`, which no matrix entry ever set — unreachable code
      # that looked like proof the cross-compile path worked. When
      # aarch64-unknown-linux-gnu is re-added, add the branch back *with* the
      # matrix key that selects it, in the same commit.
      - name: Build
        shell: bash
        run: |
          # `-p otsniff-web` builds the pack binaries too (ADR-0019). Their
          # dev-dependencies (reqwest) aren't built by `cargo build`, so this
          # adds no C-toolchain requirements to the release matrix.
          cargo build --release --target ${{ matrix.target }} -p otsniff -p otsniff-web

      - name: Package
        shell: bash
        run: |
          # Core binary.
          name="otsniff-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/otsniff${{ matrix.ext }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          stems=("$name")

          # Packs (ADR-0019): one artifact each, named with the *release tag*
          # rather than the pack crate's own version, so `otsniff pack add`
          # and install.sh can build the URL from the core version alone.
          for pack in web; do
            stem="otsniff-${pack}-${GITHUB_REF_NAME}-${{ matrix.target }}"
            mkdir -p "dist/$stem"
            cp "target/${{ matrix.target }}/release/otsniff-${pack}${{ matrix.ext }}" "dist/$stem/"
            cp "crates/otsniff-${pack}/README.md" LICENSE "dist/$stem/"
            stems+=("$stem")
          done

          cd dist
          for stem in "${stems[@]}"; do
            tar czf "$stem.tar.gz" "$stem"
            if command -v sha256sum >/dev/null; then
              sha256sum "$stem.tar.gz" > "$stem.tar.gz.sha256"
            elif command -v shasum >/dev/null; then
              shasum -a 256 "$stem.tar.gz" > "$stem.tar.gz.sha256"
            else
              echo "::error::no sha256sum or shasum on this runner" >&2
              exit 1
            fi
          done

          # ADV-P2 F-P2-033: every installer refuses to install without a
          # sidecar, so a release published with tarballs and no sidecars is
          # 100% broken while CI reports green. Assert the pairing here, in
          # the only job that can still see both files.
          for stem in "${stems[@]}"; do
            for f in "$stem.tar.gz" "$stem.tar.gz.sha256"; do
              [ -s "$f" ] || { echo "::error::packaging produced no $f" >&2; exit 1; }
            done
            # A sidecar that doesn't verify here cannot verify on a user's
            # machine either — same computation, same bytes.
            if command -v sha256sum >/dev/null; then
              sha256sum -c "$stem.tar.gz.sha256" >/dev/null
            else
              shasum -a 256 -c "$stem.tar.gz.sha256" >/dev/null
            fi
            echo "packaged $stem.tar.gz (+ sidecar, verified)"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          # ADV-P2 F-P2-033: default is `warn`, which uploads nothing and
          # still goes green.
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          # ADV-P2 F-P2-033: warn-on-unmatched is the default, so a release
          # could be created with no assets attached at all.
          fail_on_unmatched_files: true
          # Stable releases (tag has no '-') draft for human review before
          # publish; dev/pre-releases (tag like vX.Y.Z-dev.N) auto-publish.
          # This is deliberate — see #106, which made `draft` conditional
          # precisely so dev cuts stop needing a manual publish while stable
          # ones keep the gate.
          #
          # ADV-P2 F-P2-009 read this as "every tag lands in a bucket
          # `/releases/latest` excludes, so the README install command can
          # never resolve a version." That inference is wrong, and a brief
          # remediation that set `draft: false` here was wrong with it: a
          # human publishes the stable draft as the last step of the release
          # playbook, and it becomes `latest` at that point. v0.6.0 is live
          # and `latest` today.
          #
          # What is true, and is handled in install.sh instead: between
          # tagging a stable release and publishing its draft, `latest` still
          # points at the *previous* stable — and a repo with no stable
          # release at all (only vX.Y.Z-dev.N prereleases) has no `latest`
          # whatsoever. install.sh falls back to enumerating `/releases` and
          # taking the newest non-draft entry, which covers both.
          draft: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
