name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # aarch64-unknown-linux-gnu via cross-rs hits glibc-version
          # mismatches on recent build scripts (e.g. serde_core 1.0.228).
          # Re-add in v0.2 when we sort out the right cross-compile path.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          # `-p otsniff-web` builds the pack binaries too (ADR-0019). Their
          # dev-dependencies (reqwest) aren't built by `cargo build`, so this
          # adds no C-toolchain requirements to the release matrix.
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p otsniff -p otsniff-web
          else
            cargo build --release --target ${{ matrix.target }} -p otsniff -p otsniff-web
          fi

      - name: Package
        shell: bash
        run: |
          # Core binary.
          name="otsniff-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/otsniff${{ matrix.ext }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          stems=("$name")

          # Packs (ADR-0019): one artifact each, named with the *release tag*
          # rather than the pack crate's own version, so `otsniff pack add`
          # and install.sh can build the URL from the core version alone.
          for pack in web; do
            stem="otsniff-${pack}-${GITHUB_REF_NAME}-${{ matrix.target }}"
            mkdir -p "dist/$stem"
            cp "target/${{ matrix.target }}/release/otsniff-${pack}${{ matrix.ext }}" "dist/$stem/"
            cp "crates/otsniff-${pack}/README.md" LICENSE "dist/$stem/"
            stems+=("$stem")
          done

          cd dist
          for stem in "${stems[@]}"; do
            tar czf "$stem.tar.gz" "$stem"
            if command -v sha256sum >/dev/null; then
              sha256sum "$stem.tar.gz" > "$stem.tar.gz.sha256"
            else
              shasum -a 256 "$stem.tar.gz" > "$stem.tar.gz.sha256"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          # Stable releases (tag has no '-') draft for human review before
          # publish; dev/pre-releases (tag like vX.Y.Z-dev.N) auto-publish.
          draft: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
