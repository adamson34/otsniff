name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # macOS runs on every PR and every push. The 10× billing multiplier
  # only applies to private repos; public repos get unlimited Actions
  # minutes on the free tier, so we restore full coverage. otsniff is
  # pure Rust and we ship macOS binaries, so PR signal on macOS is
  # worth having even if functional divergence between Linux and macOS
  # is rare for this codebase.
  #
  # Root cause of the macOS flake (diagnosed empirically across PR #60
  # and PR #61): `Swatinem/rust-cache@v2`'s cache restore step mutates
  # something — likely either the runner's PATH or a binary placed in
  # `~/.cargo/bin` — such that after restore, plain `cargo` resolves to
  # `rustup-init` rather than the rustup-managed proxy installed by
  # `dtolnay/rust-toolchain@stable`. The PATH guard in #61 confirmed
  # the toolchain step's cargo resolution (`cargo 1.95.0 (f2d3ce0bd)`),
  # then Swatinem ran "Cache restored successfully ... full match: true"
  # and the next `cargo test` failed with the same rustup-init error.
  #
  # The fix is to skip PATH resolution entirely and call cargo by its
  # absolute installed path: `$HOME/.cargo/bin/cargo`. The rustup proxy
  # at that exact path is the one dtolnay/rust-toolchain installs and
  # is unaffected by whatever Swatinem does to PATH.
  #
  # S-3.06 verification gate: 5 consecutive clean develop-push macOS
  # runs starting from this commit's CI run.
  test-macos:
    name: Test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (absolute path, bypasses PATH-resolution flake)
        run: |
          echo "Resolved cargo: $(which cargo || echo none)"
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/cargo" test --all-features

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # NB: pin the toolchain via `with: toolchain:`, not via the action ref
      # (`@1.85.0` would be parsed by dependabot as an action version and
      # "updated" to a non-existent rust release).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  no-user-paths:
    name: No user paths in committed files (POL-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/lint-no-user-paths.sh

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
