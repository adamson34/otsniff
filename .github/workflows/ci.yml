name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # macOS runs on every PR and every push. The 10× billing multiplier
  # only applies to private repos; public repos get unlimited Actions
  # minutes on the free tier, so we restore full coverage. otsniff is
  # pure Rust and we ship macOS binaries, so PR signal on macOS is
  # worth having even if functional divergence between Linux and macOS
  # is rare for this codebase.
  #
  # Root cause of the macOS flake (diagnosed empirically across #60, #61, #62):
  # `Swatinem/rust-cache@v2`'s cache restore step REPLACES the rustup proxy
  # binary at `~/.cargo/bin/cargo` with `rustup-init` bytes. PR #62 proved
  # this conclusively: invoking `$HOME/.cargo/bin/cargo --version` returned
  # "rustup-init 1.29.0 (2026-03-05)" — the file at the cargo proxy path
  # IS rustup-init, not a rustup multi-call proxy. Calling rustup-init with
  # `test` then fails with "unexpected argument 'test' found".
  #
  # The fix: re-run `rustup default stable` after Swatinem's cache restore
  # to recreate the proxy symlinks. This is option (b'+) from S-3.06 —
  # combine PATH cache benefits with explicit proxy repair.
  #
  # S-3.06 verification gate: 5 consecutive clean develop-push macOS runs
  # starting from this commit's CI run.
  test-macos:
    name: Test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Repair rustup proxy after cache restore
        run: |
          rustup default stable
          echo "Resolved cargo: $(which cargo)"
          cargo --version
          rustc --version
      - run: cargo test --all-features

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # NB: pin the toolchain via `with: toolchain:`, not via the action ref
      # (`@1.85.0` would be parsed by dependabot as an action version and
      # "updated" to a non-existent rust release).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  no-user-paths:
    name: No user paths in committed files (POL-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/lint-no-user-paths.sh

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
