name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # macOS runs on every PR and every push. The 10× billing multiplier
  # only applies to private repos; public repos get unlimited Actions
  # minutes on the free tier, so we restore full coverage. otsniff is
  # pure Rust and we ship macOS binaries, so PR signal on macOS is
  # worth having even if functional divergence between Linux and macOS
  # is rare for this codebase.
  #
  # NB: pinned to `macos-14` (stopgap) rather than `macos-latest` because
  # `macos-latest` (currently macOS 15 image) intermittently ships a
  # broken rustup proxy that resolves `cargo` → `rustup-init`, causing
  # `cargo test` to fail with "unexpected argument 'test' found" even
  # though `dtolnay/rust-toolchain@stable` reports successful setup.
  # Hit three times in 48 hours on this repo (PR #58 CI, develop push
  # after #58, develop push after #59). Each cleared on rerun. Full
  # investigation tracked as S-3.06 — the spec requires a write-up plus
  # a 5-consecutive-clean-runs verification gate; this pin is the
  # immediate stopgap so develop-pushes stop failing.
  test-macos:
    name: Test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # NB: pin the toolchain via `with: toolchain:`, not via the action ref
      # (`@1.85.0` would be parsed by dependabot as an action version and
      # "updated" to a non-existent rust release).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  no-user-paths:
    name: No user paths in committed files (POL-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/lint-no-user-paths.sh

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
