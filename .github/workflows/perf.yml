name: Perf

on:
  schedule:
    - cron: "0 12 * * 0"  # Sunday noon UTC
  pull_request:
    types: [labeled]

jobs:
  bench:
    name: Benchmarks
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.label.name, 'perf')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install hyperfine
        run: sudo apt-get install -y hyperfine

      - name: Build release binary
        run: cargo build --release

      - name: Run hyperfine end-to-end
        run: |
          hyperfine \
            --warmup 2 \
            --runs 10 \
            --export-markdown /tmp/hyperfine.md \
            "target/release/otsniff analyze tests/fixtures/synthetic-1mb.pcap -o /tmp/out.html"

      - name: Run criterion microbenches
        run: |
          cargo bench \
            --bench parse_modbus \
            --bench parse_enip \
            --bench parse_s7comm \
            --bench parse_dhcp \
            --bench observe_pipeline \
            --bench findings_run

      # Soft alert: comment on the PR (or create an issue for scheduled runs)
      # when criterion detects a regression (> 2x slower than saved baseline).
      # Non-blocking per AC-003: CI job does not fail on regression.
      - name: Check for criterion regressions (soft alert)
        if: always()
        run: |
          if find target/criterion -name 'regression.json' 2>/dev/null | xargs grep -l '"regression":true' 2>/dev/null | grep -q .; then
            echo "::warning::Criterion detected a performance regression. See target/criterion for details."
          fi

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            /tmp/hyperfine.md
            target/criterion/
