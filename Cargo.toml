[package]
name = "otsniff"
version = "0.5.0-dev.1"
edition = "2021"
rust-version = "1.85"
description = "One-shot OT-aware PCAP triage. Feed it a span-port capture, get an exec-readable HTML report."
license = "Apache-2.0"
repository = "https://github.com/adamson34/otsniff"
keywords = ["ics", "ot", "scada", "modbus", "security"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pcap-parser = { version = "0.16", features = ["data"] }
etherparse = "0.15"
askama = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ipnet = { version = "2.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
sha2 = "0.11"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
pretty_assertions = "1.4"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json"] }
tempfile = "3"
criterion = "0.8"

[lints.rust]
# `kani` is a well-known custom cfg injected by cargo-kani during proof runs.
# Declaring it here suppresses the unexpected_cfgs lint that fires on normal
# `cargo build` / `cargo check` / `cargo clippy` invocations.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "otsniff"
path = "src/main.rs"

[[bench]]
name = "parse_modbus"
harness = false

[[bench]]
name = "parse_enip"
harness = false

[[bench]]
name = "parse_s7comm"
harness = false

[[bench]]
name = "parse_dhcp"
harness = false

[[bench]]
name = "observe_pipeline"
harness = false

[[bench]]
name = "findings_run"
harness = false
