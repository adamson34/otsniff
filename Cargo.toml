[package]
name = "otsniff"
version = "0.3.0-dev.1"
edition = "2021"
rust-version = "1.85"
description = "One-shot OT-aware PCAP triage. Feed it a span-port capture, get an exec-readable HTML report."
license = "Apache-2.0"
repository = "https://github.com/example/otsniff"
keywords = ["ics", "ot", "scada", "modbus", "security"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pcap-parser = { version = "0.16", features = ["data"] }
etherparse = "0.15"
askama = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ipnet = { version = "2.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
sha2 = "0.10"

[dev-dependencies]
pretty_assertions = "1.4"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "otsniff"
path = "src/main.rs"
